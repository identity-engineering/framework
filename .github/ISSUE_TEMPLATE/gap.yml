name: Framework Gap
description: Propose or document a critical gap or limitation in Identity Engineering (English only)
title: "[Gap] "
labels: ["gap"]
body:
  - type: markdown
    attributes:
      value: |
        Gaps are public and treated as solvable (or explicitly accepted limitations).
        **Write the entire issue in English** (title, description, impact, mitigation).
        See `docs/gaps-system/SKILL.md` for labels and rules.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is missing, weak, or under-specified? (English)
      placeholder: Clear statement of the gap…
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What fails, loses credibility, or stays blocked if this gap remains? (English)
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: Mitigation / path forward
      description: Concrete next steps, even if long-term. Partial paths are fine. (English)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Primary problem type (also set the matching area:* label if you can)
      options:
        - conceptual
        - mathematical
        - practical
        - audience
        - process
        - energetic
        - ownership
        - other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Dual Mission scope
      options:
        - dual
        - human
        - substrate-free
    validations:
      required: true

  - type: input
    id: pages
    attributes:
      label: Related site pages
      description: Optional paths or concept names (e.g. /framework/time, ownership)
      placeholder: /framework/time, /critical-gaps

  - type: checkboxes
    id: big_gap
    attributes:
      label: Big gap
      options:
        - label: This is a major theme (type:big-gap)

  - type: markdown
    attributes:
      value: |
        After submit, maintainers (or you, if you have access) should add labels:
        `area:*`, `priority:*`, `page:*`, optional `type:big-gap`, `scope:*`, `status:*`.
